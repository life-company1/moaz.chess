<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHESS MOAZZ | المنصة الاحترافية</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            --gold-premium: #d4af37;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --light-square: #eaf0f6; 
            --dark-square: #2b4865;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--gold-premium), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .clocks-container {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .clock {
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .active-clock {
            border-color: var(--gold-premium);
            color: var(--gold-premium);
            box-shadow: 0 0 15px rgba(214, 175, 55, 0.3);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 1400px;
            padding: 10px;
            flex: 1;
            justify-content: center;
        }

        .lobby-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 30px 20px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
        }

        .btn {
            background: linear-gradient(90deg, #8a7322, var(--gold-premium));
            color: #000;
            font-weight: 800;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        .btn-action {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-action:hover { background: #30363d; color: #fff; }

        .status-bar {
            font-size: 1.1rem;
            color: var(--gold-premium);
            font-weight: 700;
            text-align: center;
            padding: 5px 10px;
        }

        .game-wrapper {
            display: none;
            flex-direction: row-reverse;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            position: relative;
        }

        .board-container {
            position: relative;
            max-width: 500px;
            max-height: 500px;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 94vw;
            height: 94vw;
            max-width: 500px;
            max-height: 500px;
            border: 8px solid #0d1117;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            user-select: none;
        }

        @media (max-width: 900px) {
            .game-wrapper { flex-direction: column; align-items: center; }
            .chessboard { width: 94vw; height: 94vw; }
            .side-panel { width: 94vw !important; height: auto !important; margin-top: 10px; }
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            user-select: none;
            cursor: pointer;
        }

        .light { background-color: var(--light-square); }
        .dark { background-color: var(--dark-square); }
        .selected { background-color: rgba(212, 175, 55, 0.55) !important; }
        .in-check-square { box-shadow: inset 0 0 20px #ff3333 !important; background-color: rgba(255, 51, 51, 0.4) !important; }

        .piece-img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            z-index: 10;
            user-select: none;
            pointer-events: none;
        }

        .side-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            width: 320px;
            height: 500px;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
        }

        .history-title {
            font-size: 1rem;
            color: var(--gold-premium);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 5px;
            text-align: center;
        }

        .moves-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 35px 1fr 1fr;
            gap: 6px;
            font-size: 0.9rem;
            text-align: center;
            align-items: center;
            max-height: 150px;
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 8px;
        }

        /* تصميم قسم الدردشة */
        .chat-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--glass-border);
            padding-top: 10px;
        }
        .chat-box {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-bottom: 8px;
            max-height: 120px;
            text-align: right;
        }
        .chat-msg { margin-bottom: 4px; }
        .chat-msg span { color: var(--gold-premium); font-weight: bold; }
        
        .emoji-bar {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        .emoji-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .emoji-btn:hover { background: rgba(255,255,255,0.15); }

        .action-bar {
            display: flex;
            gap: 10px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .custom-modal {
            background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
            border: 1px solid var(--gold-premium);
            padding: 25px;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        footer { width: 100%; text-align: center; padding: 15px; font-size: 0.85rem; color: #888; }
        footer span { color: var(--gold-premium); }
    </style>
</head>
<body>

    <header>
        <h1>CHESS MOAZZ</h1>
    </header>

    <div class="container">
        <div class="lobby-panel" id="lobby">
            <input type="text" id="playerName" placeholder="أدخل اسمك الملكي">
            
            <label style="display: block; margin: 10px 0 5px 0; font-size: 0.9rem; color: #aaa; text-align: right;">اختر نظام الوقت:</label>
            <select id="timeControlSelect">
                <option value="60">1 دقيقة (برصاصة)</option>
                <option value="180" selected>3 دقائق (خاطف)</option>
                <option value="300">5 دقائق (خاطف)</option>
                <option value="600">10 دقائق (سريع)</option>
            </select>

            <button class="btn" onclick="startOffline()">لعب محلي (نفس الجهاز)</button>
            <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 20px 0;">
            <button class="btn" onclick="createNewRoom()">إنشاء غرفة جديدة</button>
            <input type="text" id="roomCodeInput" placeholder="أدخل كود الغرفة المكون من 5 رموز">
            <button class="btn" onclick="joinExistingRoom()">انضمام وتأكيد الغرفة</button>
        </div>

        <div class="clocks-container" id="clocks-area" style="display: none;">
            <div class="clock" id="white-clock">الأبيض: --:--</div>
            <div class="clock" id="black-clock">الأسود: --:--</div>
        </div>

        <div class="status-bar" id="game-status">مرحباً بك في المنصة الاحترافية</div>

        <div class="game-wrapper" id="chess-area">
            <div class="board-container">
                <div class="chessboard" id="board"></div>
            </div>
            
            <div class="side-panel">
                <div class="history-title">سجل النقلات الفوري</div>
                <div class="moves-list" id="moves-container"></div>
                
                <div class="chat-panel">
                    <div class="history-title">صندوق الاستفزاز والدردشة 💬</div>
                    <div class="chat-box" id="chat-box-messages"></div>
                    <div class="emoji-bar">
                        <button class="emoji-btn" onclick="sendQuickChat('😎 حظاً موفقاً المرة القادمة!')">😎</button>
                        <button class="emoji-btn" onclick="sendQuickChat('😂 حبل أفكارك اتمسح؟')">😂</button>
                        <button class="emoji-btn" onclick="sendQuickChat('🤔 نقلة غريبة جداً!')">🤔</button>
                        <button class="emoji-btn" onclick="sendQuickChat('🤫 صمت لو سمحت بفكّرك')">🤫</button>
                        <button class="emoji-btn" onclick="sendQuickChat('🥱 لعب ممل.. أسرع!')">🥱</button>
                        <button class="emoji-btn" onclick="sendQuickChat('💥 كش ملك تقترب!')">💥</button>
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="chatInput" placeholder="اكتب رسالة سريعة..." style="margin-bottom:0; padding:8px; font-size:0.85rem;">
                        <button class="btn" onclick="sendCustomChat()" style="margin-top:0; width:70px; padding:8px; font-size:0.85rem;">إرسال</button>
                    </div>
                </div>

                <div class="action-bar">
                    <button class="btn-action" onclick="triggerResign()">🏳️ انسحاب</button>
                    <button class="btn-action" onclick="triggerDrawOffer()">🤝 طلب تعادل</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="gameOverModal">
        <div class="custom-modal">
            <h2 id="gameOverTitle" style="color: #ff3333; font-size: 2rem; margin-bottom: 10px;">انتهت المعركة!</h2>
            <p id="gameOverText" style="color: #fff; margin-bottom: 20px; font-size: 1.1rem;"></p>
            <button class="btn" onclick="clearSessionAndReload()">القائمة الرئيسية 🔄</button>
        </div>
    </div>

    <div class="modal-overlay" id="drawModal">
        <div class="custom-modal">
            <h3 style="color: var(--gold-premium); margin-bottom: 15px;">عرض تعادل للصلح 🤝</h3>
            <p style="color: #fff; margin-bottom: 20px;">الخصم يعرض عليك إنهاء الموقعة بالتعادل الودي، هل تقبل?</p>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#2563eb; color:#fff;" onclick="respondToDraw(true)">قبول</button>
                <button class="btn" style="background:#dc2626; color:#fff;" onclick="respondToDraw(false)">رفض</button>
            </div>
        </div>
    </div>

    <footer>
        sourced by <span>moazz ibrahim</span>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAT04pc5omOGfvE-D70W06rYs2ydcL9mkY",
            authDomain: "moazz-chess.firebaseapp.com",
            databaseURL: "https://moazz-chess-default-rtdb.firebaseio.com",
            projectId: "moazz-chess",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let game = new Chess();
        let isOnline = false;
        let currentRoomCode = null;
        let playerColor = 'w'; 
        let selectedSquare = null;

        let whiteTime = 180;
        let blackTime = 180;
        let clockInterval = null;
        let currentName = "لاعب";

        const pieceImages = {
            'wP': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
            'wR': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            'wN': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            'wB': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            'wQ': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            'wK': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
            'bP': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            'bR': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
            'bN': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
            'bB': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
            'bQ': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            'bK': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        };

        window.toggleModal = function(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }

        window.clearSessionAndReload = function() {
            localStorage.clear();
            location.reload();
        }

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateClocksUI() {
            document.getElementById('white-clock').innerText = `الأبيض: ${formatTime(whiteTime)}`;
            document.getElementById('black-clock').innerText = `الأسود: ${formatTime(blackTime)}`;
            document.getElementById('white-clock').classList.toggle('active-clock', game.turn() === 'w');
            document.getElementById('black-clock').classList.toggle('active-clock', game.turn() === 'b');
        }

        function startClockTimer() {
            if (clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(() => {
                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) handleTimeOut('w');
                } else {
                    blackTime--;
                    if (blackTime <= 0) handleTimeOut('b');
                }
                updateClocksUI();

                if (!isOnline) {
                    localStorage.setItem('local_wtime', whiteTime);
                    localStorage.setItem('local_btime', blackTime);
                } else if (isOnline && playerColor === 'w') {
                    update(ref(db, 'rooms/' + currentRoomCode), { whiteTime, blackTime });
                }
            }, 1000);
        }

        function handleTimeOut(loserColor) {
            clearInterval(clockInterval);
            let winner = loserColor === 'w' ? 'الأسود' : 'الأبيض';
            document.getElementById('gameOverTitle').innerText = "انتهى الوقت!";
            document.getElementById('gameOverText').innerText = `فوز ساحق للاعب ${winner}.`;
            toggleModal('gameOverModal', true);
        }

        function drawBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            const ranks = playerColor === 'b' ? [1, 2, 3, 4, 5, 6, 7, 8] : [8, 7, 6, 5, 4, 3, 2, 1];
            const files = playerColor === 'b' ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];

            for (let r of ranks) {
                for (let f of files) {
                    const squareName = String.fromCharCode(97 + f) + r;
                    const squareData = game.get(squareName);

                    const squareDiv = document.createElement('div');
                    squareDiv.classList.add('square', (r + f) % 2 === 0 ? 'dark' : 'light');
                    squareDiv.dataset.square = squareName;

                    if (selectedSquare === squareName) squareDiv.classList.add('selected');

                    if (game.in_check() && squareData && squareData.type === 'k' && squareData.color === game.turn()) {
                        squareDiv.classList.add('in-check-square');
                    }

                    if (squareData) {
                        const img = document.createElement('img');
                        img.classList.add('piece-img');
                        img.src = pieceImages[squareData.color + squareData.type.toUpperCase()];
                        squareDiv.appendChild(img);
                    }

                    // دعم اللمس والنقرات العادية للموبايل بسلاسة فائقة بدون تعليق
                    squareDiv.onclick = () => handleSquareClick(squareName);
                    boardElement.appendChild(squareDiv);
                }
            }
        }

        function handleSquareClick(square) {
            if (isOnline && game.turn() !== playerColor) return;

            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && (!isOnline || piece.color === game.turn())) {
                    selectedSquare = square; 
                    drawBoard();
                }
            } else {
                if (selectedSquare === square) {
                    selectedSquare = null;
                    drawBoard();
                    return;
                }
                executeChessMove(selectedSquare, square); 
                selectedSquare = null;
            }
        }

        function executeChessMove(from, to) {
            const move = game.move({ from: from, to: to, promotion: 'q' });
            if (move) {
                if (isOnline) {
                    update(ref(db, 'rooms/' + currentRoomCode), { 
                        fen: game.fen(), 
                        history: game.history(),
                        whiteTime: whiteTime,
                        blackTime: blackTime
                    });
                } else {
                    localStorage.setItem('local_fen', game.fen());
                    localStorage.setItem('local_history', JSON.stringify(game.history()));
                    localStorage.setItem('local_wtime', whiteTime);
                    localStorage.setItem('local_btime', blackTime);
                    
                    drawBoard(); renderMovesList(); checkGameOver(); updateStatus(); updateClocksUI();
                }
            } else {
                // إذا ضغط على قطعة أخرى من نفس لونه بدلاً من النقل، قم بتحديدها هي
                const clickedPiece = game.get(to);
                if(clickedPiece && (!isOnline || clickedPiece.color === game.turn())) {
                    selectedSquare = to;
                } else {
                    selectedSquare = null;
                }
                drawBoard();
            }
        }

        window.triggerResign = function() {
            if (!confirm("هل أنت متأكد من قرار الانسحاب؟")) return;
            if (isOnline) {
                update(ref(db, 'rooms/' + currentRoomCode), { gameOverReason: `resign-${playerColor}` });
            } else {
                clearInterval(clockInterval);
                document.getElementById('gameOverTitle').innerText = "انسحاب!";
                document.getElementById('gameOverText').innerText = `انتهت المعركة بالاستسلام.`;
                toggleModal('gameOverModal', true);
            }
        };

        window.triggerDrawOffer = function() {
            if (!isOnline) return alert("طلب التعادل متاح فقط في المباريات المباشرة أونلاين!");
            update(ref(db, 'rooms/' + currentRoomCode), { drawOffer: playerColor });
            alert("تم إرسال طلب التعادل، بانتظار قرار الخصم...");
        };

        window.respondToDraw = function(accept) {
            toggleModal('drawModal', false);
            if (accept) {
                update(ref(db, 'rooms/' + currentRoomCode), { gameOverReason: 'draw-accepted', drawOffer: '' });
            } else {
                update(ref(db, 'rooms/' + currentRoomCode), { drawOffer: 'declined' });
            }
        };

        // دوال الدردشة الجديدة
        window.sendQuickChat = function(msg) {
            if (!isOnline) return alert("الدردشة متاحة في غرف الأونلاين فقط!");
            update(ref(db, 'rooms/' + currentRoomCode), { chatMessage: `${currentName}: ${msg}_${Date.now()}` });
        };

        window.sendCustomChat = function() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            if (!isOnline) return alert("الدردشة متاحة في غرف الأونلاين فقط!");
            update(ref(db, 'rooms/' + currentRoomCode), { chatMessage: `${currentName}: ${msg}_${Date.now()}` });
            input.value = '';
        };

        function checkGameOver() {
            if (game.in_checkmate()) {
                clearInterval(clockInterval);
                const loser = game.turn() === 'w' ? 'الأبيض' : 'الأسود';
                document.getElementById('gameOverTitle').innerText = "كش ملك مات!";
                document.getElementById('gameOverText').innerText = `سقطت قلاع الملك ${loser}.`;
                toggleModal('gameOverModal', true);
            } else if (game.in_draw()) {
                clearInterval(clockInterval);
                document.getElementById('gameOverTitle').innerText = "تعادل تلقائي!";
                document.getElementById('gameOverText').innerText = `انتهت المبارة بالتعادل الفني.`;
                toggleModal('gameOverModal', true);
            }
        }

        function renderMovesList() {
            const container = document.getElementById('moves-container');
            container.innerHTML = '';
            const history = game.history();

            for (let i = 0; i < history.length; i += 2) {
                const stepNum = Math.floor(i / 2) + 1;
                container.innerHTML += `
                    <div style="color:#555; font-weight:bold;">${stepNum}.</div>
                    <div style="color:#fff;">${history[i]}</div>
                    <div style="color:#aaa;">${history[i+1] || ''}</div>
                `;
            }
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus() {
            let text = `دور: ${game.turn() === 'w' ? 'الأبيض' : 'الأسود'}`;
            document.getElementById('game-status').innerText = text;
        }

        window.startOffline = function() {
            let selectedTime = parseInt(document.getElementById('timeControlSelect').value);
            isOnline = false;

            if (localStorage.getItem('local_fen')) {
                game.load(localStorage.getItem('local_fen'));
                whiteTime = parseInt(localStorage.getItem('local_wtime')) || selectedTime;
                blackTime = parseInt(localStorage.getItem('local_btime')) || selectedTime;
            } else {
                game = new Chess();
                whiteTime = selectedTime;
                blackTime = selectedTime;
            }

            document.getElementById('lobby').style.display = 'none'; 
            document.getElementById('chess-area').style.display = 'flex';
            document.getElementById('clocks-area').style.display = 'flex';

            drawBoard(); renderMovesList(); startClockTimer(); updateClocksUI(); updateStatus();
        };

        window.createNewRoom = function() {
            let selectedTime = parseInt(document.getElementById('timeControlSelect').value);
            currentName = document.getElementById('playerName').value || "الملك الأبيض";
            let code = '';
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            currentRoomCode = `CH-${code}`; 
            playerColor = 'w'; 
            isOnline = true;
            whiteTime = selectedTime; 
            blackTime = selectedTime;

            const roomRef = ref(db, 'rooms/' + currentRoomCode);
            set(roomRef, {
                roomId: currentRoomCode, 
                status: "waiting", 
                playerWhite: currentName, 
                playerBlack: "",
                fen: game.fen(), 
                history: [],
                whiteTime: whiteTime,
                blackTime: blackTime,
                drawOffer: "",
                gameOverReason: "",
                chatMessage: ""
            }).then(() => {
                document.getElementById('lobby').innerHTML = `
                    <h3 style="color:var(--gold-premium); margin-bottom:15px;">في انتظار انضمام الخصم...</h3>
                    <p style="font-size:1.2rem; color:#fff; margin-bottom:10px;">كود الغرفة المباشر:</p>
                    <div style="background:#000; padding:12px; font-size:1.5rem; letter-spacing:2px; font-weight:bold; border-radius:8px; border:1px solid var(--gold-premium); color:#fff;">${currentRoomCode}</div>
                `;
                listenToRoom(currentRoomCode);
            });
        };

        window.joinExistingRoom = function() {
            currentName = document.getElementById('playerName').value || "الأسود المهاجم";
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!code) return alert("الرجاء إدخال كود الغرفة بشكل صحيح!");

            const roomRef = ref(db, 'rooms/' + code);
            get(roomRef).then((snapshot) => {
                if (!snapshot.exists()) return alert("⚠️ كود الغرفة غير موجود!");
                currentRoomCode = code; 
                playerColor = 'b'; 
                isOnline = true;

                update(roomRef, { playerBlack: currentName, status: "playing" }).then(() => {
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('chess-area').style.display = 'flex';
                    document.getElementById('clocks-area').style.display = 'flex';
                    drawBoard(); // التأكد من رسم الرقعة فوراً للاعب الثاني
                    listenToRoom(code);
                });
            });
        };

        let lastChatTimestamp = null;
        function listenToRoom(code) {
            const roomRef = ref(db, 'rooms/' + code);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (data.status === "playing" && document.getElementById('chess-area').style.display !== 'flex') {
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('chess-area').style.display = 'flex';
                    document.getElementById('clocks-area').style.display = 'flex';
                    drawBoard();
                    startClockTimer();
                }

                // استقبال الشات
                if (data.chatMessage) {
                    const parts = data.chatMessage.split('_');
                    const textContent = parts[0];
                    const timestamp = parts[1];
                    if (timestamp !== lastChatTimestamp) {
                        lastChatTimestamp = timestamp;
                        const chatBox = document.getElementById('chat-box-messages');
                        chatBox.innerHTML += `<div class="chat-msg">${textContent}</div>`;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }

                if (data.drawOffer && data.drawOffer !== playerColor && data.drawOffer !== 'declined') {
                    toggleModal('drawModal', true);
                }

                if (data.gameOverReason) {
                    clearInterval(clockInterval);
                    if (data.gameOverReason === 'draw-accepted') {
                        document.getElementById('gameOverTitle').innerText = "صلح ووئام!";
                        document.getElementById('gameOverText').innerText = "تم إنهاء الموقعة بالتعادل المقبول بين الطرفين.";
                    } else if (data.gameOverReason.startsWith('resign')) {
                        const loser = data.gameOverReason.split('-')[1] === 'w' ? 'الأبيض' : 'الأسود';
                        const winner = loser === 'الأبيض' ? 'الأسود' : 'الأبيض';
                        document.getElementById('gameOverTitle').innerText = "انتصار بالانسحاب!";
                        document.getElementById('gameOverText').innerText = `استسلم اللاعب ${loser}. فاز اللاعب ${winner}!`;
                    }
                    toggleModal('gameOverModal', true);
                    return;
                }

                if (data.fen !== game.fen()) {
                    game.load(data.fen);
                    whiteTime = data.whiteTime;
                    blackTime = data.blackTime;
                    
                    drawBoard(); renderMovesList(); checkGameOver(); updateStatus(); updateClocksUI();
                }
            });
        }

        if (localStorage.getItem('local_fen')) {
            window.startOffline();
        }
    </script>
</body>
</html>
